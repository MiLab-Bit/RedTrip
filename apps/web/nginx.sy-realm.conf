# RedTrip on sy-realm.ltd（宝塔 / nginx 子路径）
#
# 站点：https://sy-realm.ltd/redtrip/
# API ：https://sy-realm.ltd/redtrip/v1/  →  127.0.0.1:8799
# Auth：https://sy-realm.ltd/redtrip/auth/v1/ → 同 API（已合并）
#
# 构建：VITE_BASE=/redtrip/  VITE_API_BASE=/redtrip
# 部署：scripts/deploy_sy_realm.sh

server {
    listen 80;
    listen 443 ssl http2;
    server_name sy-realm.ltd www.sy-realm.ltd;

    # ssl_certificate     /www/server/panel/vhost/cert/sy-realm.ltd/fullchain.pem;
    # ssl_certificate_key /www/server/panel/vhost/cert/sy-realm.ltd/privkey.pem;

    # —— RedTrip 静态 ——
    location /redtrip/ {
        alias /www/wwwroot/sy-realm.ltd/redtrip/;
        try_files $uri $uri/ /redtrip/index.html;
        index index.html;
    }

    # SPA fallback（部分宝塔需独立 rewrite）
    location = /redtrip {
        return 301 /redtrip/;
    }

    # —— RedTrip API ——
    location /redtrip/v1/ {
        proxy_pass http://127.0.0.1:8799/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # —— Auth（与 API 同进程）——
    location /redtrip/auth/v1/ {
        proxy_pass http://127.0.0.1:8799/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE 策展流
    location /redtrip/v1/curate/stream/ {
        proxy_pass http://127.0.0.1:8799/v1/curate/stream/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
    }
}
