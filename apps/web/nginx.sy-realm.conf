# RedTrip on sy-realm.ltd（宝塔 / nginx）
# 公网 HTTPS：https://sy-realm.ltd/redtrip/（Cloudflare 命名隧道 → 本机 :80）

server {
    listen 80;
    server_name sy-realm.ltd www.sy-realm.ltd;

    location = /redtrip { return 301 /redtrip/; }

    location /redtrip/ {
        alias /www/wwwroot/sy-realm.ltd/redtrip/;
        index index.html;
        try_files $uri $uri/ @redtrip_spa;
    }
    location @redtrip_spa { rewrite ^ /redtrip/index.html last; }
    location = /redtrip/index.html {
        alias /www/wwwroot/sy-realm.ltd/redtrip/index.html;
    }

    location /redtrip/v1/ {
        proxy_pass http://127.0.0.1:8799/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
    location /redtrip/auth/v1/ {
        proxy_pass http://127.0.0.1:8799/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
