<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-hidden="true">
  <!-- 红鸢纸鸢：菱形骨架 + 交叉 spar + 尾线抽丝 -->
  <defs>
    <linearGradient id="kiteFill" x1="32" y1="8" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A8322A" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#A8322A" stop-opacity="0.03"/>
    </linearGradient>
  </defs>
  <!-- diamond body -->
  <path d="M32 8 L52 30 L32 52 L12 30 Z" fill="url(#kiteFill)" stroke="#A8322A" stroke-width="2.1" stroke-linejoin="round"/>
  <!-- spars -->
  <path d="M32 8 L32 52" stroke="#A8322A" stroke-width="1.35" stroke-linecap="round" opacity="0.9"/>
  <path d="M12 30 L52 30" stroke="#A8322A" stroke-width="1.35" stroke-linecap="round" opacity="0.9"/>
  <!-- soft paper folds -->
  <path d="M32 8 L22 30 L32 52" fill="#A8322A" fill-opacity="0.05"/>
  <!-- bow tails -->
  <path d="M22 48 L18 58 M26 50 L24 58" stroke="#A8322A" stroke-width="1.2" stroke-linecap="round" opacity="0.75"/>
  <path d="M42 48 L46 58 M38 50 L40 58" stroke="#A8322A" stroke-width="1.2" stroke-linecap="round" opacity="0.75"/>
  <!-- kite string drawn out -->
  <path d="M32 52 C36 56 42 58 48 56 C52 55 55 52 56 48" stroke="#A8322A" stroke-width="1.45" stroke-linecap="round" fill="none"/>
  <circle cx="56" cy="48" r="2.4" fill="#A8322A"/>
</svg>
