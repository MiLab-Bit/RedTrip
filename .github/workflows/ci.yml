name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build contracts (web 的契约/类型来源)
        run: pnpm --filter @redtrip/contracts build
      - name: Typecheck (contracts + web)
        run: pnpm typecheck
      - name: Web unit tests
        run: pnpm --filter @redtrip/web test
      - name: Build web
        run: pnpm build
