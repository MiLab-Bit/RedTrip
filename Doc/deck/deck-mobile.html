<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1c21" />
  <title>红鸢 RedTrip · 手机阅读</title>
  <style>
    :root { --xuan:#f2ebdd; --ink:#1a1c21; --vermilion:#a8322a; --rule:#d9cdb8; }
    * { box-sizing:border-box; }
    html, body {
      margin:0; height:100%; background:#1a1c21; color:var(--xuan);
      font-family:"PingFang SC","Noto Sans SC",sans-serif;
      -webkit-text-size-adjust:100%; overscroll-behavior:none;
    }
    header {
      position:fixed; top:0; left:0; right:0; z-index:20;
      display:flex; align-items:center; justify-content:space-between; gap:8px;
      padding:max(10px, env(safe-area-inset-top)) 12px 10px;
      background:rgba(26,28,33,.94); backdrop-filter:blur(8px);
      border-bottom:1px solid #333;
    }
    header .t { font-size:15px; font-weight:600; }
    header .s { font-size:12px; opacity:.7; }
    .zoom-btns { display:flex; gap:6px; }
    .zoom-btns button, .bar button {
      border:0; border-radius:999px; padding:8px 12px; font:inherit; font-size:14px;
      background:#fff8ee; color:var(--ink); touch-action:manipulation;
    }
    #viewport {
      position:fixed; inset:0; top:52px; bottom:64px;
      overflow:auto; -webkit-overflow-scrolling:touch;
      touch-action:pan-x pan-y pinch-zoom;
      background:#2a2622;
    }
    #canvas {
      position:relative; transform-origin:0 0;
      width:1920px; height:1080px;
      margin:12px auto 24px;
    }
    #canvas img {
      display:block; width:1920px; height:1080px;
      user-select:none; -webkit-user-drag:none;
      box-shadow:0 12px 40px rgba(0,0,0,.45);
    }
    .bar {
      position:fixed; left:0; right:0; bottom:0; z-index:20;
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      padding:10px 12px max(10px, env(safe-area-inset-bottom));
      background:rgba(26,28,33,.96); border-top:1px solid #333;
    }
    .bar .num { font-size:14px; opacity:.9; min-width:72px; text-align:center; }
    .tip {
      position:fixed; left:50%; bottom:78px; transform:translateX(-50%);
      z-index:15; padding:6px 12px; border-radius:999px;
      background:rgba(168,50,42,.92); color:#fff; font-size:12px;
      pointer-events:none; opacity:0; transition:opacity .3s;
    }
    .tip.show { opacity:1; }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="t">红鸢 RedTrip</div>
      <div class="s">手机阅读 · 可捏合放大</div>
    </div>
    <div class="zoom-btns">
      <button type="button" id="zout" aria-label="缩小">－</button>
      <button type="button" id="zin" aria-label="放大">＋</button>
      <button type="button" id="zfit">适应</button>
    </div>
  </header>
  <div id="viewport"><div id="canvas"><img id="slide" alt="幻灯片" /></div></div>
  <div class="tip" id="tip">双指捏合放大，拖动查看细节</div>
  <div class="bar">
    <button type="button" id="prev">上一页</button>
    <span class="num" id="num">01 / 17</span>
    <button type="button" id="next">下一页</button>
  </div>
  <script>
    const TOTAL = 17;
    let page = 1;
    let scale = 1;
    const vp = document.getElementById("viewport");
    const canvas = document.getElementById("canvas");
    const img = document.getElementById("slide");
    const num = document.getElementById("num");
    const tip = document.getElementById("tip");
    const pad = n => String(n).padStart(2,"0");
    function fitScale() {
      // Aim for readable body text (~2.2x phone-width shrink of 1920)
      const readable = (vp.clientWidth * 2.35) / 1920;
      const maxFit = Math.max(vp.clientWidth / 1920, vp.clientHeight / 1080);
      return Math.min(Math.max(readable, maxFit), 2.8);
    }
    function applyScale(s, cx, cy) {
      const prev = scale;
      scale = Math.min(3.2, Math.max(0.35, s));
      const rect = vp.getBoundingClientRect();
      const mx = (cx ?? rect.width / 2) + vp.scrollLeft;
      const my = (cy ?? rect.height / 2) + vp.scrollTop;
      const rx = mx / prev, ry = my / prev;
      canvas.style.transform = `scale(${scale})`;
      canvas.style.width = "1920px";
      canvas.style.height = "1080px";
      // Keep layout size for scrollbars
      canvas.style.marginBottom = `${(scale - 1) * 1080 + 24}px`;
      canvas.style.marginRight = `${(scale - 1) * 1920}px`;
      vp.scrollLeft = rx * scale - (cx ?? rect.width / 2);
      vp.scrollTop = ry * scale - (cy ?? rect.height / 2);
    }
    function render() {
      img.src = `slides/${pad(page)}.png`;
      num.textContent = `${pad(page)} / ${pad(TOTAL)}`;
    }
    function go(d) {
      page = ((page - 1 + d + TOTAL) % TOTAL) + 1;
      render();
      vp.scrollLeft = 0;
      vp.scrollTop = 0;
    }
    document.getElementById("prev").onclick = () => go(-1);
    document.getElementById("next").onclick = () => go(1);
    document.getElementById("zin").onclick = () => applyScale(scale * 1.25);
    document.getElementById("zout").onclick = () => applyScale(scale / 1.25);
    document.getElementById("zfit").onclick = () => {
      applyScale(vp.clientWidth / 1920);
      vp.scrollLeft = 0; vp.scrollTop = 0;
    };
    let touchX = 0;
    vp.addEventListener("touchstart", e => {
      if (e.touches.length === 1) touchX = e.touches[0].clientX;
    }, {passive:true});
    vp.addEventListener("touchend", e => {
      if (e.changedTouches.length !== 1) return;
      const dx = e.changedTouches[0].clientX - touchX;
      if (Math.abs(dx) > 80 && scale <= fitScale() * 1.05) go(dx < 0 ? 1 : -1);
    }, {passive:true});
    window.addEventListener("resize", () => applyScale(fitScale()));
    img.onload = () => {
      applyScale(fitScale());
      tip.classList.add("show");
      setTimeout(() => tip.classList.remove("show"), 2200);
    };
    render();
  </script>
</body>
</html>
